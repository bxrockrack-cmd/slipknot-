name: Build Windows VST3

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: slipknot-drummer
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build:
    name: Windows x64 VST3
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Configure x64
        run: cmake -B build -A x64 -DCMAKE_BUILD_TYPE=Release
      - name: Build VST3
        run: cmake --build build --config Release --parallel
      - name: Package VST3
        shell: bash
        run: |
          mkdir -p dist
          found=0
          while IFS= read -r p; do
            name=$(basename "$p")
            echo "Packaging: $p"
            (cd "$(dirname "$p")" && cmake -E tar cf "$GITHUB_WORKSPACE/dist/$name-Windows-x64.zip" --format=zip "$name")
            found=1
          done < <(find build -name "*.vst3" -not -path "*/Contents/*")
          if [ "$found" = "0" ]; then
            echo "::error::No .vst3 bundle found"
            exit 1
          fi
      - name: Upload VST3 artifact
        uses: actions/upload-artifact@v4
        with:
          name: Slipknot-Drummer-Windows-x64-VST3
          path: dist/*.zip
          if-no-files-found: error
          retention-days: 30

  release:
    name: Publish tagged release
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - name: Download artifact
        uses: actions/download-artifact@v4
        with:
          name: Slipknot-Drummer-Windows-x64-VST3
          path: dist
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*.zip
          generate_release_notes: true
